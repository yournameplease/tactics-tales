name: test

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  test:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main

      - name: Install Lua
        uses: hishamhm/gh-actions-lua@master

      - name: Install LuaRocks
        uses: hishamhm/gh-actions-luarocks@master

      - name: Install dependencies
        run: |
          luarocks install busted && luarocks install luassert && luarocks install lua-language-server

      - name: Test
        run: |
          make test

